# cargo-deny configuration — enforces AGENT.md §2 (licences) and §18.11 (supply chain).

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # libbz2-rs-sys (pure-Rust bzip2): the permissive bzip2 licence.
    "bzip2-1.0.6",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path; they are never published.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
