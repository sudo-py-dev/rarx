[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
rarx-io = { path = "crates/rarx-io" }
rarx-checksum = { path = "crates/rarx-checksum" }
rarx-crypto = { path = "crates/rarx-crypto" }
rarx-codecs = { path = "crates/rarx-codecs" }
rarx-filters = { path = "crates/rarx-filters" }
rarx-formats = { path = "crates/rarx-formats" }
rarx-core = { path = "crates/rarx-core" }
rarx-testkit = { path = "crates/rarx-testkit" }

flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
jiff = "0.2"

[workspace.lints.rust]
# Crates that genuinely need `unsafe` (see AGENT.md §18.6) opt in with a crate-level
# `#![allow(unsafe_code)]`; every other crate additionally declares `#![forbid(unsafe_code)]`.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

# Size-optimised profile for SFX stubs (AGENT.md §12.4).
[profile.sfx]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true
